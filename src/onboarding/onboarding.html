<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Pesto</title>
  <link rel="stylesheet" href="onboarding.css">
</head>
<body>
  <div id="pesto-onboarding">
    <div class="pesto-ob-container">
      <div class="pesto-ob-header">
        <svg width="32" height="32" viewBox="0 0 51 51" fill="none">
          <rect x="10.5" y="4.5" width="30" height="19" rx="2" fill="#538700"/>
          <rect x="10.5" y="27.5" width="16" height="19" rx="2" fill="#538700"/>
        </svg>
        <h1>Welcome to Pesto</h1>
        <p class="pesto-ob-subtitle">Autofill job application forms from your Notion answer bank.</p>
      </div>

      <div class="pesto-ob-steps">
        <div class="pesto-ob-progress"></div>
        <div class="pesto-ob-step-content"></div>
      </div>

      <div class="pesto-ob-nav">
        <button class="pesto-ob-back" style="display:none">Back</button>
        <div class="pesto-ob-spacer"></div>
        <button class="pesto-ob-next">Continue</button>
      </div>
    </div>
  </div>
  <script src="onboarding.js"></script>
</body>
</html>
